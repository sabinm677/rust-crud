[package]
name = "rust-crud"
version = "0.1.0"
edition = "2024"

exclude = [
    ".env.example"
]

[workspace]
members = [".", "entity", "migration"]


[dependencies]
actix-web = "4.5.1"
entity = { path = "entity" }
migration = { path = "migration" } 
serde = "1.0.197"
serde_json = "1.0.1"
env_logger = "0.11.3"
dotenv = "0.15.0"
lazy_static = "1.4.0"
sea-orm = { version = "0.12", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }

sha256 = "1.5.0"
chrono = "0.4.37"
jsonwebtoken = "9.3.0"

